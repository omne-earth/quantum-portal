; qp-stunnel — post-quantum TLS terminator for the operator mesh.
;
; Terminates TLS 1.3 with an ML-KEM-1024 key exchange and an ML-DSA-87 server
; certificate, then forwards the decrypted plaintext to a local backend. Runs as
; the unprivileged qp-stunnel user, confined by the qp_stunnel_t SELinux domain,
; linking qp-ssh's bundled OpenSSL (the only TLS stack with native ML-KEM/ML-DSA).
;
; Shipped %config(noreplace) — operator edits survive upgrades. The cert,
; key, and (for mTLS) client CA are EJBCA-issued and provisioned OUT OF BAND; they
; are deliberately NOT in the rpm. The service stays stopped until they exist.

; systemd Type=simple — stay in the foreground and log to stderr (journald).
; NB: stunnel has no inline comments — keep every ';' note on its own line.
foreground = yes

[qp-mesh]
; Post-quantum TLS listener.operator provisioning pins this to the node's mesh
; interface address; the default binds all interfaces (the mesh nftables ruleset
; + the qp_stunnel_port_t SELinux label gate who can actually reach :9443).
accept     = 9443

; Plaintext backend the decrypted traffic is forwarded to (a local service or
; container on loopback). operator provisioning sets the real target.
connect    = 127.0.0.1:8080

; Server identity — EJBCA-issued ML-DSA-87 leaf + private key, provisioned
; separately (qp_stunnel_cert_t).
cert       = /usr/local/qp/etc/qp-stunnel.crt
key        = /usr/local/qp/etc/qp-stunnel.key

; Pure post-quantum TLS 1.3: ML-KEM-1024 key exchange only.
sslVersion = TLSv1.3
curves     = MLKEM1024

; Mutual TLS — the operator-only mesh trust model. Enable once the client CA is
; provisioned (verify = 2 requires + verifies a client cert chained to CAfile):
;verify     = 2
;CAfile     = /usr/local/qp/etc/qp-stunnel-ca.crt
